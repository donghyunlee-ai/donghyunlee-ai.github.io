<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://donghyunlee.kr/practice/en/">
  <title>Redirecting to Today's Coding Problem Leaderboard</title>
  <script>
    (function () {
      var q = location.search || "";
      var h = location.hash && location.hash.length > 1 ? location.hash :
        (q.indexOf("duel=") >= 0 ? ("#/coding-test-en/hunt" + q) : "#/coding-test-en/daily?board=1");
      location.replace("/practice/" + h);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/practice/#/coding-test-en/daily?board=1">
</head>
<body>
  <p><a href="/practice/#/coding-test-en/daily?board=1">Open Today's Coding Problem Leaderboard →</a></p>
</body>
</html>
