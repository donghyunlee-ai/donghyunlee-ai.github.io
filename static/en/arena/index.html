<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://donghyunlee.kr/practice/en/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Daily Python Coding Problem">
  <meta property="og:description" content="One daily Python coding problem and live solve records.">
  <meta property="og:url" content="https://donghyunlee.kr/en/arena/">
  <meta property="og:image" content="https://donghyunlee.kr/practice/assets/icons/og-coding.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Redirecting to Today's Coding Problem Leaderboard</title>
  <script>
    (function () {
      var q = location.search || "";
      var sp = typeof URLSearchParams !== "undefined" ? new URLSearchParams(q) : null;
      var d = sp ? (sp.get("d") || "") : "";
      var r = sp ? (sp.get("r") || "") : "";
      var validD = /^\d{4}-\d{2}-\d{2}$/.test(d) ? ("/" + d) : "";
      var h;
      if (location.hash && location.hash.length > 1) {
        h = location.hash;
      } else if (sp && sp.get("duel")) {
        h = "#/coding-test-en/hunt" + q;
      } else if (r) {
        h = "#/coding-test-en/daily" + validD + "?r=" + encodeURIComponent(r);
      } else if (validD) {
        h = "#/coding-test-en/daily" + validD + "?board=1";
      } else {
        h = "#/coding-test-en/daily?board=1";
      }
      location.replace("/practice/" + h);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/practice/#/coding-test-en/daily?board=1">
</head>
<body>
  <p><a href="/practice/#/coding-test-en/daily?board=1">Open Today's Coding Problem Leaderboard →</a></p>
</body>
</html>
