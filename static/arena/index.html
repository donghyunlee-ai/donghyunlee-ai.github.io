<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://donghyunlee.kr/practice/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="오늘의 파이썬 코딩 문제">
  <meta property="og:description" content="날마다 열리는 파이썬 코딩 문제 1개와 실시간 풀이 기록">
  <meta property="og:url" content="https://donghyunlee.kr/arena/">
  <meta property="og:image" content="https://donghyunlee.kr/practice/assets/icons/og-coding.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>파이썬 코딩 테스트 · 오늘의 코딩 문제 순위표로 이동 중</title>
  <script>
    (function () {
      var q = location.search || "";
      var sp = typeof URLSearchParams !== "undefined" ? new URLSearchParams(q) : null;
      var d = sp ? (sp.get("d") || "") : "";
      var r = sp ? (sp.get("r") || "") : "";
      var validD = /^\d{4}-\d{2}-\d{2}$/.test(d) ? ("/" + d) : "";
      var h;
      if (location.hash && location.hash.length > 1) {
        h = location.hash;
      } else if (sp && sp.get("duel")) {
        h = "#/coding-test/hunt" + q;
      } else if (r) {
        h = "#/coding-test/daily" + validD + "?r=" + encodeURIComponent(r);
      } else if (validD) {
        h = "#/coding-test/daily" + validD + "?board=1";
      } else {
        h = "#/coding-test/daily?board=1";
      }
      location.replace("/practice/" + h);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/practice/#/coding-test/daily?board=1">
</head>
<body>
  <p><a href="/practice/#/coding-test/daily?board=1">오늘의 코딩 문제 순위표 열기 →</a></p>
</body>
</html>
