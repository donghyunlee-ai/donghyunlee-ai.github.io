# Hugo 허브 사이트 설정 — 이동현 박사
# 커스텀 도메인 확정(2026-07-09). CNAME은 static/CNAME → public/CNAME 으로 복사된다.
# 배포 워크플로가 --baseURL 을 Pages 설정값으로 덮어쓰므로, 이 값은 로컬 빌드 기준이다.
baseURL = "https://donghyunlee.kr/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
title = "이동현의 신뢰할 수 있는 AI 노트"   # 확정 2026-07-08 (네이버 블로그명과 동일)
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
pagination.pagerSize = 10

[params]
  description = "현장에서 작동하는 AI를 만듭니다 — 감염병·환경 예측의 설명가능한 AI. 이동현 박사."
  author = "이동현"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = false

  [params.homeInfoParams]
    Title = "현장에서 작동하는 AI를 만듭니다"
    Content = "감염병·환경 예측에 설명가능하고 신뢰할 수 있는 AI를 적용하는 연구자이자 창업가, 이동현입니다. 여기에는 대표 글과 연구 노트를 모읍니다."

  [[params.socialIcons]]
    name = "email"
    url = "mailto:donghyunlee-ai@gmail.com"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "글"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "about"
    name = "소개"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "talks"
    name = "강연·문의"
    url = "/talks/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "주제"
    url = "/tags/"
    weight = 40

[markup.goldmark.renderer]
  unsafe = true   # 마크다운 내 HTML 허용(이미지 캡션 등)
