{{ if .IsHome -}}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "{{ site.Home.Permalink }}#person",
    "name": "{{ .Site.Params.Author.name | safeJS }}",
    {{ with .Site.Params.description }}"description": "{{ . | safeJS }}",{{ end }}
    {{ with .Site.Language.Locale }}"inLanguage": "{{ . }}",{{ end }}
    {{ with .Site.Params.Author.email }}"email": "{{ . }}",{{ end }}
    "url": {{ site.Home.Permalink | safeURL }}
  }
  </script>
{{ else }}
  {{- $iso8601 := "2006-01-02T15:04:05-07:00" -}}
  {{- $schemaType := cond (and .IsPage (eq .Section "posts")) "BlogPosting" "WebPage" -}}
  {{- $description := .Description | default .Summary | plainify -}}
  <script type="application/ld+json">
  [{
    "@context": "https://schema.org",
    "@type": "{{ $schemaType }}",
    {{ if eq $schemaType "BlogPosting" }}"articleSection": "{{ (site.GetPage .Section).Title | safeJS }}",{{ end }}
    "name": "{{ .Title | safeJS }}",
    "headline": "{{ .Title | safeJS }}",
    {{ with $description }}"description": "{{ . | safeJS }}",{{ end }}
    {{ with .Site.Language.Locale }}"inLanguage": "{{ . }}",{{ end }}
    "url": {{ .Permalink }},
    "author": {
      "@type": "Person",
      "name": "{{ .Site.Params.Author.name | safeJS }}",
      "url": {{ site.Home.Permalink | safeURL }}
    },
    "publisher": {
      "@type": "Person",
      "name": "{{ .Site.Params.Author.name | safeJS }}"
    },
    {{ with .Params.images }}
      {{ $imageName := index . 0 }}
      {{ with $.Resources.GetMatch $imageName }}"image": {{ .Permalink }},{{ end }}
    {{ end }}
    {{ with .PublishDate }}"copyrightYear": "{{ .Format "2006" }}",{{ end }}
    {{ with .Date }}"dateCreated": "{{ .Format $iso8601 }}",{{ end }}
    {{ with .PublishDate }}"datePublished": "{{ .Format $iso8601 }}",{{ end }}
    {{ with .ExpiryDate }}"expires": "{{ .Format $iso8601 }}",{{ end }}
    {{ with .Lastmod }}"dateModified": "{{ .Format $iso8601 }}",{{ end }}
    {{ if .Keywords }}
      {{ with .Keywords }}"keywords": {{ . }},{{ end }}
    {{ else }}
      {{ with .Params.tags }}"keywords": {{ . }},{{ end }}
    {{ end }}
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": {{ .Permalink }}
    },
    "wordCount": "{{ .WordCount }}"
  }{{ if site.Params.enableStructuredBreadcrumbs | default false }},
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {{- $position := 0 -}}
      {{- range .Ancestors -}}
        {{- if not .IsHome -}}
          {{- $position = add $position 1 -}}
          {
            "@type": "ListItem",
            "position": {{ $position }},
            "name": "{{ .Title }}",
            "item": {{ .Permalink }}
          },
        {{- end -}}
      {{- end -}}
      {{- $position = add $position 1 -}}
      {
        "@type": "ListItem",
        "position": {{ $position }},
        "name": "{{ .Title }}",
        "item": {{ .Permalink }}
      }
    ]
  }{{ end }}]
  </script>
{{ end }}
