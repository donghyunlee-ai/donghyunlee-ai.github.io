<section
  id="analytics-consent"
  class="analytics-consent"
  role="region"
  aria-label="분석 쿠키 선택"
  aria-describedby="analytics-consent-description"
  hidden>
  <div class="analytics-consent__panel">
    <div class="analytics-consent__copy">
      <strong>분석 쿠키를 사용할까요?</strong>
      <p id="analytics-consent-description">
        동의하면 사이트 개선을 위해 방문 정보가 Google Analytics로 전송·처리됩니다.
        거부해도 사이트 이용에는 제한이 없습니다.
        <a href="{{ "privacy/" | relLangURL }}">자세히 보기</a>
      </p>
    </div>
    <div class="analytics-consent__actions">
      <button type="button" data-analytics-consent="denied">거부</button>
      <button
        type="button"
        class="analytics-consent__accept"
        data-analytics-consent="granted">
        동의
      </button>
    </div>
  </div>
</section>

<script>
  (function () {
    "use strict";

    const banner = document.getElementById("analytics-consent");
    const analytics = window.donghyunleeAnalytics;
    if (!banner || !analytics) return;

    function openBanner(moveFocus) {
      banner.hidden = false;
      if (moveFocus) {
        const firstButton = banner.querySelector("button");
        if (firstButton) firstButton.focus();
      }
    }

    function closeBanner() {
      banner.hidden = true;
    }

    if (analytics.getChoice() === null) {
      openBanner(false);
    }

    document
      .querySelectorAll('a[href="#cookie-settings"]')
      .forEach(function (link) {
        link.addEventListener("click", function (event) {
          event.preventDefault();
          openBanner(true);
        });
      });

    banner.addEventListener("click", function (event) {
      const button = event.target.closest("[data-analytics-consent]");
      if (!button) return;

      analytics.setChoice(button.dataset.analyticsConsent);
      closeBanner();
    });
  })();
</script>
