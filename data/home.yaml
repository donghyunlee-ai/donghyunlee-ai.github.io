# '최근'에 글과 함께 날짜순으로 섞여 들어가는 소식. 첫 화면에는 글과 합쳐 위에서 3줄만 나온다.
# 싣는 것: 방문자가 새로 읽거나 쓸 수 있게 된 것(책 출간, 연습 사이트 새 과목·언어, 개인 자격 강연).
# 싣지 않는 것: 로고·메뉴·문구 손질, hpai·연습 사이트의 잦은 갱신, 연구실·회사 소식, 출간 전 책.
# 새 글은 적지 않는다(글 목록에서 자동으로 들어온다). 날짜는 실제 공개일, 화면에는 연·월만 보인다.
# kind: book | site | talk
